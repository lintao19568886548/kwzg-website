server {
    listen 80;
    listen [::]:80;
    server_name yizuw.org www.yizuw.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 503;
    }
}
