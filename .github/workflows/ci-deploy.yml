name: CI and production deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_IMAGE: kwzg-website
  DB_IMAGE: mariadb:11.4.5
  DEPLOY_HOST: 8.155.35.38
  DEPLOY_PORT: "22"
  DEPLOY_USER: root
  DEPLOY_PATH: /opt/kwzg-website

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        env:
          NUXT_PUBLIC_SITE_URL: https://yizuw.org
          NUXT_PUBLIC_INDEXABLE: "false"
          NUXT_ENABLE_HSTS: "false"
        run: npm run build
      - name: Security scan
        run: npm run security:scan
      - name: Git whitespace check
        run: git diff --check

  build_image_bundle:
    name: Build Linux deployment bundle
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      image: ${{ steps.release.outputs.image }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Prepare immutable image reference
        id: release
        shell: bash
        run: |
          echo "image=$APP_IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Linux AMD64 application image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.APP_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            NUXT_PUBLIC_SITE_URL=https://yizuw.org
            NUXT_PUBLIC_INDEXABLE=false
            NUXT_ENABLE_HSTS=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Pull pinned MariaDB image on the build runner
        shell: bash
        run: docker pull --platform linux/amd64 "$DB_IMAGE"
      - name: Package immutable application and database images
        shell: bash
        run: |
          set -Eeuo pipefail
          docker image inspect "$APP_IMAGE:sha-$GITHUB_SHA" >/dev/null
          docker image inspect "$DB_IMAGE" >/dev/null
          docker save "$APP_IMAGE:sha-$GITHUB_SHA" "$DB_IMAGE" | gzip -1 > deployment-images.tar.gz
          sha256sum deployment-images.tar.gz > deployment-images.tar.gz.sha256
      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: kwzg-linux-images-${{ github.sha }}
          path: |
            deployment-images.tar.gz
            deployment-images.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy_production:
    name: Deploy production application
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build_image_bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: production
      url: https://yizuw.org
    concurrency:
      group: kwzg-production
      cancel-in-progress: false
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6
      - name: Download prebuilt Linux images
        uses: actions/download-artifact@v4
        with:
          name: kwzg-linux-images-${{ github.sha }}
          path: .deploy-artifact
      - name: Verify deployment bundle checksum
        shell: bash
        working-directory: .deploy-artifact
        run: sha256sum --check deployment-images.tar.gz.sha256
      - name: Configure pinned SSH host and dedicated private key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/kwzg_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/kwzg_deploy" "$HOME/.ssh/known_hosts"
      - name: Install website-owned deployment files only
        shell: bash
        run: |
          SSH=(ssh -i "$HOME/.ssh/kwzg_deploy" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          SCP=(scp -i "$HOME/.ssh/kwzg_deploy" -P "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 700 '$DEPLOY_PATH'"
          "${SCP[@]}" docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.prod.yml"
          "${SCP[@]}" deploy/production/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy.sh"
          "${SCP[@]}" deploy/production/install-nginx.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/install-nginx.sh"
          "${SCP[@]}" deploy/nginx/yizuw.org.conf.example "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/yizuw-org.conf"
      - name: Stream prebuilt images to Docker without a registry pull
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(ssh -T -i "$HOME/.ssh/kwzg_deploy" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          gzip -dc .deploy-artifact/deployment-images.tar.gz | "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "docker load"
      - name: Migrate and switch application containers
        shell: bash
        env:
          IMAGE: ${{ needs.build_image_bundle.outputs.image }}
          TAG: ${{ needs.build_image_bundle.outputs.tag }}
        run: |
          ssh -i "$HOME/.ssh/kwzg_deploy" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes "$DEPLOY_USER@$DEPLOY_HOST" "chmod 700 '$DEPLOY_PATH/deploy.sh' '$DEPLOY_PATH/install-nginx.sh' && '$DEPLOY_PATH/deploy.sh' '$IMAGE' '$TAG'"
      - name: Validate and reload website-owned Nginx config when TLS is ready
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/kwzg_deploy" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes "$DEPLOY_USER@$DEPLOY_HOST" "if test -s /etc/nginx/certs/yizuw-org/yizuw.org.crt && test -s /etc/nginx/certs/yizuw-org/yizuw.org.key; then '$DEPLOY_PATH/install-nginx.sh' '$DEPLOY_PATH/yizuw-org.conf'; else echo 'NGINX_ACTIVATION=SKIPPED_TLS_NOT_READY'; fi"
